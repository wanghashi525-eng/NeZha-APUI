<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒元数据历史展厅</title>
    <style>
        :root { --main-red: #8e2020; --bg: #f9f7f2; }
        body { background: var(--bg); font-family: "PingFang SC", "楷体", serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; padding: 40px 0; border-bottom: 2px solid var(--main-red); margin-bottom: 40px; }
        h1 { color: var(--main-red); font-size: 2.5em; margin: 0; }

        /* 时期板块 */
        .period-section { margin-bottom: 60px; }
        .period-info { margin-bottom: 25px; }
        .period-title { color: var(--main-red); font-size: 1.8em; border-left: 6px solid var(--main-red); padding-left: 15px; }
        .period-desc { color: #666; font-style: italic; margin: 10px 0 0 20px; }

        /* 卡片容器 */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* 每一项作品卡片 */
        .item-card { 
            background: white; border: 1px solid #ddd; padding: 20px; 
            border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .item-title { font-size: 1.3em; font-weight: bold; color: #333; margin-bottom: 12px; display: block; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        /* 动态元数据字段 */
        .meta-row { font-size: 0.9em; margin-bottom: 6px; display: flex; }
        .label { color: #888; width: 80px; flex-shrink: 0; font-weight: bold; }
        .value { color: #444; }
        
        /* 标签 */
        .tag { background: #fdf2f2; color: var(--main-red); padding: 2px 8px; border-radius: 3px; font-size: 0.85em; margin-right: 5px; border: 1px solid #f9dcdc; }

        #loading { text-align: center; color: var(--main-red); font-size: 1.2em; padding: 100px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>哪吒文化演变全集</h1>
        <p>基于知识图谱元数据的数字展厅</p>
    </header>

    <div id="loading">正在开启历史之门...</div>
    <div id="main-content"></div>
</div>

<script>
    // 替换为你的 GitHub API 链接
    const API_URL = 'https://my-json-server.typicode.com/wanghashi525-eng/nezha-api/sources';

    async function loadGallery() {
        try {
            const response = await fetch(API_URL);
            const periods = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            const mainContent = document.getElementById('main-content');

            periods.forEach(periodData => {
                // 创建时期区块
                const section = document.createElement('div');
                section.className = 'period-section';
                
                // 渲染时期信息
                let sectionHtml = `
                    <div class="period-info">
                        <div class="period-title">${periodData.period}</div>
                        <div class="period-desc">${periodData.description}</div>
                    </div>
                    <div class="items-grid">
                `;

                // 循环渲染该时期下的所有作品
                periodData.items.forEach(item => {
                    sectionHtml += `
                        <div class="item-card">
                            <span class="item-title">${item.title}</span>
                            ${renderRow("年代", item.date)}
                            ${renderRow("核心情节", item.key_event || item.event || item.key_action)}
                            ${renderRow("形象描述", item.image || item.appearance || item.character_detail || item.appearance_detail)}
                            ${renderRow("法宝/特征", formatAccessories(item.accessories || item.accessory))}
                            ${renderRow("性格/主题", item.personality || item.theme || item.core_theme || item.themes)}
                            ${renderRow("角色定位", item.role)}
                        </div>
                    `;
                });

                sectionHtml += `</div>`;
                section.innerHTML = sectionHtml;
                mainContent.appendChild(section);
            });
        } catch (error) {
            document.getElementById('loading').innerHTML = "数据加载失败，请检查 API 设置。";
        }
    }

    // 辅助函数：格式化一行元数据
    function renderRow(label, value) {
        if (!value) return '';
        // 如果值是数组，将其转为标签
        if (Array.isArray(value)) {
            return `<div class="meta-row"><span class="label">${label}</span><div class="value">${value.map(v => `<span class="tag">${v}</span>`).join('')}</div></div>`;
        }
        return `<div class="meta-row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }

    // 辅助函数：处理法宝列表
    function formatAccessories(acc) {
        if (!acc) return null;
        return Array.isArray(acc) ? acc : [acc];
    }

    loadGallery();
</script>
</body>
</html>
    </script>
</body>
</html>
