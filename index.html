<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒元数据历史展厅</title>
    <style>
        /* 基础样式 */
        :root {
            --primary-color: #c0392b;
            --bg-color: #f4f1ea; /* 纸张质感的底色 */
            --card-bg: #ffffff;
            --text-main: #2c3e50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            width: 100%;
            padding-bottom: 20px;
        }

        h1 { margin: 0; color: var(--primary-color); letter-spacing: 2px; }
        .subtitle { color: #7f8c8d; margin-top: 10px; }

        /* 列表布局 */
        #nezha-list {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr; /* 纵向单列展示，适合阅读资料 */
            gap: 30px;
        }

        /* 卡片设计 */
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary-color);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateX(10px); }

        .era {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .name {
            font-size: 1.8rem;
            margin: 10px 0;
            color: #333;
        }

        .description {
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        /* 元数据标签栏 */
        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .meta-item { color: #666; }
        .meta-label { font-weight: bold; color: #999; margin-right: 5px; }

        #loading { text-align: center; font-style: italic; color: #999; }
    </style>
</head>
<body>

    <header>
        <h1>哪吒：历史与文献元数据演变</h1>
        <p class="subtitle">基于 TTL 知识图谱生成的实时 API 驱动页面</p>
    </header>

    <div id="loading">正在调取 GitHub 云端数据库...</div>
    
    <main id="nezha-list">
        </main>

    <script>
        // https://github.com/wanghashi525-eng/NeZha-APUI
        const API_URL = 'https://my-json-server.typicode.com/wanghashi525-eng/nezha-api/nezha_versions';

        async function loadNezha() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                const listContainer = document.getElementById('nezha-list');

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="era">${item.era}</div>
                        <div class="name">${item.name}</div>
                        <p class="description">${item.description}</p>
                        <div class="metadata-grid">
                            <div class="meta-item"><span class="meta-label">来源:</span> ${item.source || '文献记载'}</div>
                            <div class="meta-item"><span class="meta-label">ID:</span> ${item.id}</div>
                            ${item.author ? `<div class="meta-item"><span class="meta-label">作者/译者:</span> ${item.author}</div>` : ''}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = "无法加载数据，请检查 API 或 GitHub 仓库状态。";
                console.error(error);
            }
        }

        loadNezha();
    </script>
</body>
</html>
