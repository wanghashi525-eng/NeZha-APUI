<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒元数据查询系统</title>
    <style>
        :root { --primary: #a52a2a; --bg: #fdfaf5; }
        body { background: var(--bg); color: #333; font-family: "PingFang SC", serif; margin: 0; padding: 20px; }
        
        /* 搜索栏样式 */
        .search-container {
            max-width: 800px;
            margin: 0 auto 40px;
            text-align: center;
        }
        #searchInput {
            width: 70%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }
        #searchInput:focus { border-color: var(--primary); }
        .search-btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* 卡片样式 */
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border: 1px solid #e0e0e0; padding: 25px; margin-bottom: 25px; border-radius: 8px; transition: 0.3s; }
        .card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .era { color: var(--primary); font-weight: bold; font-size: 0.9em; }
        .name { font-size: 1.5em; margin: 10px 0; }
        .desc { line-height: 1.7; color: #555; }
        .meta-box { background: #f9f9f9; padding: 15px; margin-top: 15px; font-size: 0.85em; border-left: 3px solid #ccc; display: flex; gap: 20px; }
        .highlight { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>哪吒元数据学术查询</h1>
        <input type="text" id="searchInput" placeholder="输入时代、地点或关键词（如：唐代、敦煌）...">
        <button class="search-btn" onclick="performSearch()">查询</button>
    </div>

    <div class="container" id="app">正在加载馆藏数据...</div>

    <script>
        // 注意：请确保用户名正确
        const BASE_URL = 'https://my-json-server.typicode.com/wanghashi525-eng/NeZha-APUI/nezha_versions';

        // 初始加载
        fetchData(BASE_URL);

        // 搜索逻辑
        function performSearch() {
            const keyword = document.getElementById('searchInput').value;
            const app = document.getElementById('app');
            app.innerHTML = "正在检索中...";

            // 如果有关键词，使用 ?q= 参数进行模糊查询
            const finalUrl = keyword ? `${BASE_URL}?q=${encodeURIComponent(keyword)}` : BASE_URL;
            fetchData(finalUrl);
        }

        // 监听回车键搜索
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        async function fetchData(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                render(data);
            } catch (err) {
                document.getElementById('app').innerText = "查询出错，请稍后再试。";
            }
        }

        function render(data) {
            const app = document.getElementById('app');
            if (data.length === 0) {
                app.innerHTML = "<p style='text-align:center; color:#999;'>未找到相关元数据条目。</p>";
                return;
            }
            app.innerHTML = data.map(item => `
                <div class="card">
                    <div class="era">【${item.era}】</div>
                    <div class="name">${item.name}</div>
                    <p class="desc">${item.description}</p>
                    <div class="meta-box">
                        <div><span style="color:#888">来源:</span> ${item.source || '学术记录'}</div>
                        <div><span style="color:#888">ID:</span> <span class="highlight">${item.id}</span></div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
