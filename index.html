<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒演变：全景元数据知识库</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --ink: #1a1a1a; 
            --paper: #f4f1ea; 
            --accent-red: #a52a2a; 
        }
        body { background: var(--paper); font-family: "PingFang SC", "STSong", serif; margin: 0; color: var(--ink); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* 顶部装饰栏 */
        header { text-align: center; border-bottom: 3px double var(--gold); margin-bottom: 40px; padding-bottom: 20px; }
        h1 { font-size: 2.5em; color: var(--accent-red); margin: 10px 0; }

        /* 搜索区域 */
        .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        #searchInput { 
            width: 50%; min-width: 280px; padding: 12px 20px; 
            border: 2px solid var(--gold); border-radius: 4px; 
            background: white; font-size: 16px; outline: none;
        }
        .filter-group { display: flex; gap: 10px; }
        .btn { 
            padding: 10px 20px; cursor: pointer; border: 1px solid var(--gold); 
            background: white; transition: 0.3s; border-radius: 4px; 
        }
        .btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        /* 内容网格 */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }

        /* 卡片设计 */
        .card { 
            background: #fff; border: 1px solid #ddd; border-top: 5px solid var(--gold);
            padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }
        .type-tag { font-size: 0.75em; color: var(--gold); border: 1px solid var(--gold); padding: 2px 6px; float: right; }
        .period { color: #888; font-size: 0.9em; margin-bottom: 8px; }
        .title { font-size: 1.5em; color: var(--ink); margin: 5px 0 15px 0; font-weight: bold; }

        /* 详情信息 */
        .info-section { font-size: 0.9em; margin-bottom: 15px; }
        .label { color: #999; width: 70px; display: inline-block; font-weight: bold; }
        .narrative-box { 
            background: #fdfaf5; padding: 15px; border-radius: 4px; 
            border-left: 3px solid var(--accent-red); margin-top: auto;
        }
        .narrative-title { color: var(--accent-red); font-weight: bold; font-size: 0.95em; display: block; margin-bottom: 5px; }
        .appearance { font-style: italic; font-size: 0.85em; color: #555; margin-top: 8px; }

        /* 外部链接按钮 */
        .link-btn { color: #0645ad; text-decoration: none; font-size: 0.8em; display: block; margin-top: 10px; }
        
        #empty-state { text-align: center; color: #999; padding: 50px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>哪吒文化演变知识库</h1>
        <p>从唐代佛经到现代赛博：全维度元数据展示</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索书名、年代、法宝或关键词..." oninput="filterWorks()">
        <div class="filter-group">
            <button class="btn active" onclick="setFilter('All', this)">全部</button>
            <button class="btn" onclick="setFilter('AncientBook', this)">古籍</button>
            <button class="btn" onclick="setFilter('Film', this)">影视</button>
            <button class="btn" onclick="setFilter('PhysicalWork', this)">壁画绢画</button>
        </div>
    </div>

    <div id="gallery">正在加载馆藏数据...</div>
    <div id="empty-state">未能找到相关哪吒文化遗存</div>
</div>

<script>
 // 
const API_URL = 'https://raw.githubusercontent.com/wanghashi525-eng/NeZha-APUI/main/db.json';

let allWorks = [];
let currentFilter = 'All';

// 2. 核心数据加载函数
async function fetchData() {
    const gallery = document.getElementById('gallery');
    const loading = document.getElementById('loading');

    try {
        // 直接从 GitHub 获取原始 JSON 文件
        const response = await fetch(API_URL);
        
        if (!response.ok) {
            throw new Error(`服务器响应异常: ${response.status}`);
        }

        const data = await response.json();

        // 兼容性处理：如果数据在 works 字段下则取 works，否则取 data 本身
        allWorks = data.works ? data.works : data;

        // 隐藏加载提示
        if(loading) loading.style.display = 'none';
        
        // 执行第一次渲染
        render(allWorks);

    } catch (error) {
        console.error("加载失败详情:", error);
        if(loading) {
            loading.innerHTML = `
                <div style="color: #a52a2a; padding: 20px; border: 1px solid #ddd;">
                    <h3>数据开启失败</h3>
                    <p>原因: ${error.message}</p>
                    <p style="font-size: 0.8em; color: #666;">请确保 db.json 已上传至 main 分支且格式正确</p>
                </div>
            `;
        }
    }
}

// 3. 搜索与过滤逻辑
function setFilter(type, btn) {
    currentFilter = type;
    // 切换按钮高亮状态
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterWorks();
}

function filterWorks() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = allWorks.filter(item => {
        // 类别过滤
        const matchesType = (currentFilter === 'All' || item.type === currentFilter);
        
        // 关键词搜索（在标题、年代、描述中搜索）
        const itemString = JSON.stringify(item).toLowerCase();
        const matchesKeyword = itemString.includes(keyword);
        
        return matchesType && matchesKeyword;
    });

    render(filtered);
    
    // 处理空结果
    const emptyState = document.getElementById('empty-state');
    if(emptyState) {
        emptyState.style.display = filtered.length === 0 ? 'block' : 'none';
    }
}

// 4. 渲染函数（专门适配你复杂的 JSON 结构）
function render(data) {
    const gallery = document.getElementById('gallery');
    if (!gallery) return;

    gallery.innerHTML = data.map(item => {
        // 自动识别你的多层级叙事结构 (narrative 或 narratives)
        let narrative = {};
        if (item.narratives) {
            // 如果是复数形式，取第一个叙事点
            narrative = Object.values(item.narratives)[0];
        } else if (item.narrative) {
            narrative = item.narrative;
        }

        // 提取哪吒的外貌描述（兼容多个字段名）
        const appearance = narrative?.appearance_nezha?.depiction || 
                           narrative?.appearance_liyunxiang?.depiction || 
                           "暂无详细形象描述";

        // 提取创作者姓名
        const creatorName = item.creator?.name || "佚名";

        return `
            <div class="card">
                <span class="type-tag">${item.type}</span>
                <div class="period">${item.period || '未知年代'}</div>
                <div class="title">${item.title}</div>
                
                <div class="info-section">
                    <div><span class="label">创作者:</span>${creatorName}</div>
                    ${item.form ? `<div><span class="label">载体:</span>${item.form}</div>` : ''}
                    ${item.manifestation?.edition ? `<div><span class="label">文献本:</span>${item.manifestation.edition}</div>` : ''}
                </div>

                <div class="narrative-box">
                    <span class="narrative-title">◈ ${narrative?.name || '核心意旨'}</span>
                    <div style="font-size: 0.85em; color: #444;">${narrative?.core_theme || '点击查看详情'}</div>
                    <div class="appearance">【特征】${appearance}</div>
                </div>

                ${narrative?.character_nezha?.homepage ? 
                    `<a href="${narrative.character_nezha.homepage}" target="_blank" class="link-btn">参考馆藏词条 →</a>` : ''}
            </div>
        `;
    }).join('');
}

// 5. 启动加载
fetchData();
</script>
</body>
</html>
