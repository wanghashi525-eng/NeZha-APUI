<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒演变全景元数据知识库</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --ink: #1a1a1a; 
            --paper: #f4f1ea; 
            --accent-red: #a52a2a; 
            --box-bg: #fdfaf5;
        }

        body { 
            background: var(--paper); 
            font-family: "PingFang SC", "STSong", "SimSun", serif; 
            margin: 0; color: var(--ink); line-height: 1.6; 
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* 头部装饰 */
        header { 
            text-align: center; 
            border-bottom: 3px double var(--gold); 
            margin-bottom: 40px; padding-bottom: 20px; 
        }
        h1 { font-size: 2.8em; color: var(--accent-red); margin: 10px 0; font-family: "STSong", serif; }
        .subtitle { letter-spacing: 2px; color: #666; font-size: 0.9em; }

        /* 搜索区域 */
        .search-section { 
            background: white; padding: 20px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
            position: sticky; top: 10px; z-index: 100; border: 1px solid var(--gold);
        }
        .search-box { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        #searchInput { 
            flex: 1; min-width: 300px; padding: 12px 20px; 
            border: 2px solid #ddd; border-radius: 4px; font-size: 16px; outline: none;
        }
        #searchInput:focus { border-color: var(--gold); }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .btn { 
            padding: 10px 18px; cursor: pointer; border: 1px solid #ddd; 
            background: #f9f9f9; transition: 0.3s; border-radius: 4px; font-size: 0.9em;
        }
        .btn:hover { background: #eee; }
        .btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        /* 内容布局 */
        #gallery { display: grid; grid-template-columns: 1fr; gap: 40px; }

        /* 深度详细卡片设计 */
        .card { 
            background: white; border: 1px solid #e0d8c8; border-top: 6px solid var(--accent-red);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card-header { padding: 25px 30px 15px; background: linear-gradient(to bottom, #fff, #fdfaf5); }
        .type-tag { 
            background: var(--gold); color: white; padding: 3px 10px; 
            font-size: 0.75em; border-radius: 3px; float: right; 
        }
        .period-label { color: #888; font-size: 0.95em; font-weight: bold; }
        .main-title { font-size: 2.2em; color: var(--ink); margin: 10px 0; font-family: "STSong", serif; }

        .content-body { padding: 0 30px 30px; }

        /* 元数据网格 */
        .metadata-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 6px; margin-bottom: 25px;
        }
        .meta-item { font-size: 0.92em; }
        .meta-item strong { color: #555; margin-right: 5px; }

        /* 标签设计 */
        .character-zone { margin-bottom: 20px; }
        .tag-char { 
            display: inline-block; background: #eee; color: #444; 
            padding: 3px 12px; border-radius: 15px; font-size: 0.82em; 
            margin: 0 8px 8px 0; border: 1px solid #ddd;
        }

        /* 叙事段落 */
        .narrative-segment { 
            border-left: 4px solid var(--gold); padding-left: 20px; 
            margin-top: 25px; margin-bottom: 35px;
        }
        .segment-name { font-size: 1.2em; color: var(--accent-red); font-weight: bold; margin-bottom: 10px; }
        .segment-meta { font-size: 0.9em; color: #666; margin-bottom: 10px; display: grid; gap: 5px; }
        
        /* 外观档案盒 */
        .appearance-box { 
            background: #fffdf2; border: 1px solid #f0e68c; 
            padding: 15px; border-radius: 4px; margin-top: 15px;
        }
        .appearance-box h4 { margin: 0 0 8px 0; font-size: 0.95em; color: #8b4513; border-bottom: 1px solid #eee; }
        .app-detail { font-size: 0.88em; margin: 4px 0; color: #444; }
        .tag-accessory { color: var(--accent-red); font-weight: bold; }

        .footer-link { 
            text-align: center; background: #f4f4f4; padding: 15px; 
            text-decoration: none; color: #666; font-size: 0.9em; transition: 0.3s;
            border-top: 1px solid #eee;
        }
        .footer-link:hover { background: var(--accent-red); color: white; }

        #loading, #empty-state { text-align: center; padding: 100px; font-size: 1.2em; color: #999; }
        hr { border: 0; border-top: 1px double var(--gold); margin: 30px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>哪吒演变全景元数据知识库</h1>
        <p class="subtitle">NEZHA EVOLUTION METADATA REPOSITORY</p>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索作品、人物、法宝、性格或描述关键词..." oninput="filterWorks()">
            <div class="filter-group">
                <button class="btn active" onclick="setFilter('All', this)">全部</button>
                <button class="btn" onclick="setFilter('AncientBook', this)">古籍文献</button>
                <button class="btn" onclick="setFilter('Film', this)">影视动画</button>
                <button class="btn" onclick="setFilter('PhysicalWork', this)">壁画实物</button>
            </div>
        </div>
    </div>

    <div id="loading">📜 正在翻阅卷轴，请稍候...</div>
    <div id="gallery"></div>
    <div id="empty-state" style="display:none;">未能找到相关哪吒文化记录</div>
</div>

<script>
    // 方案二：直接使用 GitHub Raw 链接，绕过大小限制
    const API_URL = 'https://raw.githubusercontent.com/wanghashi525-eng/NeZha-APUI/main/db.json';
    
    let allWorks = [];
    let currentFilter = 'All';

    async function fetchData() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('读取数据失败');
            const data = await res.json();
            
            // 兼容 {"works": []} 结构
            allWorks = data.works || data;
            
            document.getElementById('loading').style.display = 'none';
            render(allWorks);
        } catch (err) {
            document.getElementById('loading').innerHTML = "❌ 数据加载失败，请检查 GitHub 地址或 JSON 格式。";
            console.error(err);
        }
    }

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterWorks();
    }

    function filterWorks() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allWorks.filter(item => {
            const matchesType = currentFilter === 'All' || item.type === currentFilter;
            const itemString = JSON.stringify(item).toLowerCase();
            return matchesType && itemString.includes(keyword);
        });
        render(filtered);
        document.getElementById('empty-state').style.display = filtered.length === 0 ? 'block' : 'none';
    }

    function render(data) {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = data.map(item => {
            
            // 1. 处理叙事数据（支持 narrative 或 narratives 多场景）
            const narratives = item.narratives ? Object.values(item.narratives) : (item.narrative ? [item.narrative] : []);
            
            // 2. 自动化提取所有涉及角色
            let chars = [];
            narratives.forEach(n => {
                Object.keys(n).forEach(key => {
                    if(key.startsWith('character_') && n[key].name) chars.push(n[key].name);
                });
            });
            const uniqueChars = [...new Set(chars)];

            // 3. 生成叙事与形象 HTML
            const narrativeHtml = narratives.map(n => {
                const app = n.appearance_nezha || n.appearance_liyunxiang || n.appearance_liyunxiang_18 || {};
                return `
                    <div class="narrative-segment">
                        <div class="segment-name">◈ ${n.name || '核心场景'}</div>
                        <div class="segment-meta">
                            ${n.location ? `<span><strong>地点:</strong> ${n.location}</span>` : ''}
                            ${n.core_theme ? `<span><strong>核心主题:</strong> ${n.core_theme}</span>` : ''}
                            ${n.relationship_outcome ? `<span><strong>关系变迁:</strong> ${n.relationship_outcome}</span>` : ''}
                        </div>
                        
                        ${app.depiction || app.personality || app.signature_accessory ? `
                            <div class="appearance-box">
                                <h4>🎭 形象与特质档案</h4>
                                ${app.depiction ? `<p class="app-detail"><strong>视觉描述:</strong> ${app.depiction}</p>` : ''}
                                ${app.signature_accessory ? `<p class="app-detail"><strong>法宝武器:</strong> <span class="tag-accessory">${app.signature_accessory}</span></p>` : ''}
                                ${app.personality ? `<p class="app-detail"><strong>性格特质:</strong> ${app.personality}</p>` : ''}
                                ${app.battle_form ? `<p class="app-detail"><strong>战斗形态:</strong> ${app.battle_form}</p>` : ''}
                                ${app.character_arc ? `<p class="app-detail"><strong>角色弧光:</strong> ${app.character_arc}</p>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // 4. 返回完整卡片
            return `
                <div class="card">
                    <div class="card-header">
                        <span class="type-tag">${item.type}</span>
                        <div class="period-label">⏳ ${item.period}</div>
                        <div class="main-title">${item.title}</div>
                    </div>

                    <div class="content-body">
                        <div class="metadata-grid">
                            <div class="meta-item"><strong>创作者:</strong> ${item.creator?.name || '佚名'} (${item.creator?.role || '作者'})</div>
                            ${item.contributor ? `<div class="meta-item"><strong>辅助/译者:</strong> ${item.contributor.name}</div>` : ''}
                            <div class="meta-item"><strong>表现形式:</strong> ${item.form}</div>
                            ${item.manifestation ? `
                                <div class="meta-item" style="grid-column: 1/-1; border-top: 1px dashed #ddd; padding-top: 10px;">
                                    <strong>版本记录:</strong> ${item.manifestation.edition} 
                                    <span style="color:#999; font-size:0.9em;">(${item.manifestation.publication_period || ''})</span>
                                </div>
                            ` : ''}
                        </div>

                        ${uniqueChars.length > 0 ? `
                            <div class="character-zone">
                                ${uniqueChars.map(c => `<span class="tag-char">${c}</span>`).join('')}
                            </div>
                        ` : ''}

                        <div class="narrative-area">
                            ${narrativeHtml}
                        </div>
                    </div>

                    ${narratives[0]?.character_nezha?.homepage ? `
                        <a href="${narratives[0].character_nezha.homepage}" target="_blank" class="footer-link">
                            查看《${item.title}》哪吒条目详细资料 →
                        </a>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    fetchData();
</script>

</body>
</html>
