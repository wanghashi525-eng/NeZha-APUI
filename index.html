<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪吒元数据学术展厅</title>
    <style>
        body { background: #fdfaf5; color: #333; font-family: "PingFang SC", serif; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #a52a2a; padding: 20px 0; margin-bottom: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border: 1px solid #e0e0e0; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .era { color: #a52a2a; font-weight: bold; font-size: 0.9em; }
        .name { font-size: 1.5em; margin: 10px 0; color: #1a1a1a; }
        .desc { line-height: 1.7; color: #555; }
        .meta-box { background: #f9f9f9; padding: 15px; margin-top: 15px; font-size: 0.85em; border-left: 3px solid #ccc; }
        .meta-label { font-weight: bold; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>哪吒元数据 API 服务展示</h1>
        <p>数据来源：GitHub db.json (TTL 转换版)</p>
    </div>
    <div class="container" id="app">正在调取云端数据...</div>

    <script>
        // wanghashi525-eng
        const API_URL = 'https://my-json-server.typicode.com/wanghashi525-eng/NeZha-APUI/nezha_versions';

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const app = document.getElementById('app');
                app.innerHTML = data.map(item => `
                    <div class="card">
                        <div class="era">${item.era}</div>
                        <div class="name">${item.name}</div>
                        <p class="desc">${item.description}</p>
                        <div class="meta-box">
                            <div><span class="meta-label">文献来源:</span> ${item.source || '学术记录'}</div>
                            ${item.author ? `<div><span class="meta-label">作者/译者:</span> ${item.author}</div>` : ''}
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('app').innerText = "数据加载失败，请检查 API 状态。";
            });
    </script>
</body>
</html>
